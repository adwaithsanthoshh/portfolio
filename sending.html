<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sending Message...</title>

    <link rel="stylesheet" href="sending.css">
</head>

<body>

    <main class="sending-page">

        <div class="card">

            <h1>Sending Message</h1>

            <p class="subtitle">
                Please wait while your message is being delivered.
            </p>

            <div class="animation-area">

                <div class="device phone">

                    <div class="emoji">📱</div>

                    <span>You</span>

                </div>

                <div class="flight-area">

                    <div class="plane" id="plane">
                        ✈
                    </div>

                </div>

                <div class="device laptop">

                    <div class="emoji">💻</div>

                    <span>Adwaith</span>

                </div>

            </div>

            <div class="status">

                <div id="statusText">
                    Initializing...
                </div>

                <div class="progress">

                    <div class="progress-fill" id="progressFill"></div>

                </div>

            </div>

        </div>

    </main>

    <script src="sending.js"></script>

</body>

</html>
